<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV - Lukas Krocek</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html {
        font-size: 16px;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #050816;
      }

      #app-scroll {
        height: 100vh;
        overflow-y: auto;
        scrollbar-gutter: stable;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: radial-gradient(circle at top left, rgba(79,91,198,0.32), transparent 26%),
                    radial-gradient(circle at 85% 18%, rgba(60,84,166,0.24), transparent 18%),
                    linear-gradient(180deg, #050816 0%, #070c1b 36%, #050713 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        transition: opacity 0.6s ease;
      }

      #splash.splash-light {
        background: radial-gradient(circle at top left, rgba(199,210,254,0.7), transparent 24%),
                    radial-gradient(circle at 80% 18%, rgba(191,219,254,0.65), transparent 20%),
                    linear-gradient(180deg, #f8fafc 0%, #eef2ff 34%, #e2e8f0 100%);
      }

      #splash.splash-light .splash-name {
        color: #1e293b;
      }

      #splash.splash-light .splash-name span {
        color: #4f46e5;
      }

      #splash.splash-light .splash-dot {
        background: #4f46e5;
      }

      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .splash-name {
        font-family: 'Oxanium', 'Space Grotesk', sans-serif;
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 700;
        color: #e2e8f0;
        letter-spacing: 0.01em;
        opacity: 0;
        animation: splash-fade-in 0.7s ease 0.1s forwards;
      }

      .splash-name span {
        color: #8ea2ff;
      }

      .splash-dots {
        display: flex;
        gap: 8px;
        opacity: 0;
        animation: splash-fade-in 0.5s ease 0.5s forwards;
      }

      .splash-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #8ea2ff;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }

      .splash-dot:nth-child(2) { animation-delay: 0.2s; }
      .splash-dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes splash-fade-in {
        to { opacity: 1; }
      }

      @keyframes splash-pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <div id="app-scroll">
      <!-- Populated by Vite with public, crawlable CV content. -->
      <section id="seo-content" class="seo-content" aria-label="CV content"></section>
      <div id="root"></div>
    </div>
    <div id="splash">
      <div class="splash-name">Lukáš <span>Kroček</span></div>
      <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>
    <script>
      try {
        if (localStorage.getItem('cv-theme') === 'light') {
          document.getElementById('splash').classList.add('splash-light');
          document.body.style.background = '#f8fafc';
        }
      } catch (e) {}
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
