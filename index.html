    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style>
      /* Set base font size to ensure consistent rem calculations and match desired smaller size */
      html {
        font-size: 14px;
      }

      @media print {
        /* Force browsers to print background colors and images, remove shadows, etc. */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            box-shadow: none !important;
        }
        body {
          margin: 0;
          padding: 0;
        }
        .no-print {
          display: none !important;
        }
        .print-page {
          margin: 0 !important;
          border: none !important;
          box-shadow: none !important;
          transform: scale(1) !important;
          border-radius: 0 !important; /* Remove rounded corners for print */
        }
        /* Add page break after every page except the last one */
        .print-page:not(:last-child) {
            page-break-after: always;
        }
        .print-container {
          padding: 0 !important;
        }
        /* Ensure code block is visible and wraps correctly in print */
        pre {
            overflow: visible !important;
            white-space: pre-wrap !important;
            word-break: break-all !important;
        }
        /* Override any overflow-hidden containers during print to show content, unless explicitly told not to */
        [class*="overflow-hidden"]:not(.print-keep-overflow) {
          overflow: visible !important;
        }
      }
      @page {
        size: A4;
        margin: 0;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
